<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('/Users/isaacojigho/Documents/Projects/myWebsite/my-angular-website/src/images/360_F_284840354_Iu4ZVcCtYTUDrl4PK6tQEVAzBmePJhrS.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .contact-item {
            display: block;
            margin: 15px;
            font-size: 20px;
            cursor: pointer;
            text-decoration: underline;
            color: lightblue;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: white;
            color: black;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            text-align: center;
        }
        .close {
            color: red;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Me</h1>
        <p><strong>Call me anytime!</strong></p>
        
        <span class="contact-item" onclick="openModal('linkedinModal')">LinkedIn</span>
        <span class="contact-item" onclick="openModal('githubModal')">GitHub</span>
        <span class="contact-item" onclick="openModal('phoneModal')">Phone Number</span>
        <span class="contact-item" onclick="openModal('emailModal')">Email</span>
    </div>
    
    <!-- Modals -->
    <div id="linkedinModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('linkedinModal')">&times;</span>
            <p>My LinkedIn: <a href="#" target="_blank">Your LinkedIn Profile</a></p>
        </div>
    </div>
    
    <div id="githubModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('githubModal')">&times;</span>
            <p>My GitHub: <a href="#" target="_blank">Your GitHub Profile</a></p>
        </div>
    </div>
    
    <div id="phoneModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('phoneModal')">&times;</span>
            <p>Call me at: <strong>(Your Phone Number)</strong></p>
        </div>
    </div>
    
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('emailModal')">&times;</span>
            <p>Email me at: <a href="mailto:your.email@example.com">Ojigho.Oghenevwefe&#64;gmail.com</a></p>
        </div>
    </div>
    
    <script>
        function openModal(id) {
            document.getElementById(id).style.display = "block";
        }
        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }
    </script>
</body>
</html>
